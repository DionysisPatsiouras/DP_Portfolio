<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Νέο μήνυμα επικοινωνίας</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0A4075; color: #ffffff; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse: collapse; background-color: #0A4075;">
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 600px; border-collapse: collapse; border-top: 4px solid #EC1882; background-color: #003164; color: #ffffff;">
            <tr>
              <td style="padding: 28px 32px; background-color: #003164; color: #ffffff;">
                <p style="margin: 0 0 10px; color: #ff6db4; font-size: 12px; font-weight: bold; letter-spacing: 2px;">DP PORTFOLIO</p>
                <h1 style="margin: 0; font-size: 24px; font-weight: normal; line-height: 1.3;">{{title}}</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 30px 32px 12px;">
                <p style="margin: 0 0 24px; color: #ffffff; font-size: 14px; line-height: 1.6;">Έλαβες νέο μήνυμα από τη φόρμα επικοινωνίας του portfolio σου.</p>
                <p style="margin: 0 0 6px; color: #ff6db4; font-size: 11px; font-weight: bold; letter-spacing: 1px;">ΟΝΟΜΑΤΕΠΩΝΥΜΟ</p>
                <p style="margin: 0 0 22px; color: #ffffff; font-size: 16px; line-height: 1.5;">{{name}}</p>
                <p style="margin: 0 0 6px; color: #ff6db4; font-size: 11px; font-weight: bold; letter-spacing: 1px;">EMAIL</p>
                <p style="margin: 0 0 28px; color: #ffffff; font-size: 16px; line-height: 1.5;">{{email}}</p>
                <p style="margin: 0 0 10px; color: #ff6db4; font-size: 11px; font-weight: bold; letter-spacing: 1px;">ΜΗΝΥΜΑ</p>
                <pre style="margin: 0; padding: 20px; border-left: 3px solid #EC1882; background-color: #0A4075; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: break-word;">{{message}}</pre>
              </td>
            </tr>
            <tr>
              <td style="padding: 20px 32px 28px;">
                <p style="margin: 0; border-top: 1px solid #EC1882; padding-top: 18px; color: #ffffff; font-size: 12px; line-height: 1.5;">Απάντησε σε αυτό το email για να επικοινωνήσεις με τον αποστολέα.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
